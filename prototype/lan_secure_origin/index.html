<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VREconder">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="./styles.css?v=20260824_v3">
  <title>VREconder - Optics & Projection Calibration</title>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      var banner = document.getElementById('errorBanner');
      if (banner) {
        banner.style.display = 'block';
        banner.textContent = '❌ JS ERROR: ' + msg + ' (L' + line + ')';
      }
      fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level: 'CRITICAL_ERROR', message: msg + ' at ' + url + ':' + line + ':' + col, stack: err ? err.stack : null })
      }).catch(function() {});
    };
    window.onunhandledrejection = function(e) {
      var reason = e.reason ? (e.reason.message || e.reason.stack || String(e.reason)) : 'Unhandled rejection';
      var banner = document.getElementById('errorBanner');
      if (banner) {
        banner.style.display = 'block';
        banner.textContent = '❌ REJECTION: ' + reason;
      }
      fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level: 'CRITICAL_REJECTION', message: reason })
      }).catch(function() {});
    };
  </script>
</head>
<body>

  <!-- Background WebGL Stereo VR / Rectilinear Diagnostic Canvas -->
  <canvas id="glCanvas"></canvas>

  <!-- 2D Stereo Reticle / Diagnostic Grid Overlay (Unobstructed in Stage A) -->
  <canvas id="uiCanvas"></canvas>

  <video id="sourceVideo" playsinline preload="auto" crossorigin="anonymous" muted loop></video>

  <!-- Minimal Floating Banner in Stage A (Non-obstructive) -->
  <div id="stageBanner">
    <button id="btnEnterVR" class="arm-btn">
      <span>🛡️ 授权传感器并进入 VR (Arm & Enter VR)</span>
    </button>
    <div id="stageStatusText">Stage A: Flat Diagnostic (Unobstructed) | Controlled via PC</div>
  </div>

  <!-- In-VR Floating Emergency Bar -->
  <div id="vrFloatingBar" class="fade-out">
    <button class="vr-btn vr-btn-reset" id="btnVrReset">🎯 Recenter</button>
    <button class="vr-btn vr-btn-exit" id="btnVrExit">⚙ Exit VR</button>
  </div>

  <div id="errorBanner"></div>

  <!-- Hidden Focus Trap for Bluetooth Keyboard/HID Controller on iOS Safari -->
  <input id="controllerFocusTrap" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="none" style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; border:none; outline:none; pointer-events:auto;" aria-hidden="true">

  <!-- Pairing Modal for Untrusted LAN Client (P2) -->
  <div id="pairingModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.95); z-index:99999; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; color:#fff; font-family:-apple-system,sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:24px; max-width:360px; width:100%; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
      <h3 style="margin-bottom:8px; font-size:1.15rem;">🔑 设备安全配对 (Device Pairing)</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:16px; line-height:1.4;">
        请输入电脑控制台 (PC Controller) 上显示的 6 位配对码：
      </p>
      <input id="inpPairPin" type="text" pattern="[0-9]*" inputmode="numeric" placeholder="6-digit PIN" maxlength="6" style="width:100%; box-sizing:border-box; font-size:1.5rem; letter-spacing:6px; text-align:center; padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#38bdf8; font-weight:bold; margin-bottom:12px; outline:none;">
      <div id="pairingError" style="display:none; color:#f87171; font-size:0.8rem; margin-bottom:12px;"></div>
      <button id="btnSubmitPair" style="width:100%; padding:12px; font-size:0.95rem; font-weight:bold; background:#2563eb; color:#fff; border:none; border-radius:8px; cursor:pointer;">
        确认配对 (Pair &amp; Connect)
      </button>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=20260913_g04"></script>
</body>
</html>
